name: Frontend checks
on: [push, pull_request]
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm
                  cache-dependency-path: '**/package-lock.json'
            - run: npm ci
            - run: npm run check
            - run: npm run build
